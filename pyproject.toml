[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trading"]

[project]
name = "trading"
version = "2.0.0"
description = "Quantitative trading data sync and backtesting toolkit"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "adata>=2.8.2",
    "backtrader>=1.9.78.123",
    # mcp 经 pyjwt[crypto] 带进 cryptography，pymysql 也会因此导入它；
    # 实测 cryptography>=47 的 aarch64 manylinux wheel 在 Apple 芯片上的 Linux 虚拟机（colima）里
    # 导入即 SIGILL（46.0.7 正常），所以先卡在 <47；x86_64 / 原生环境是否受影响未验证。
    "cryptography>=44,<47",
    "jinja2>=3.1.4",
    "loguru>=0.7.2",
    "matplotlib>=3.7.5",
    "mcp>=1.27,<2",
    "numpy>=1.26.0",
    "pandas>=2.0.3",
    "prettytable>=3.11.0",
    "pymysql>=1.1.1",
    "python-dotenv>=1.0.1",
    "requests[socks]>=2.32.3",
    "sqlalchemy>=2.0.36",
    "tabulate>=0.9.0",
    "tenacity>=9.0.0",
    "tqdm>=4.67.0",
    "yfinance>=0.2.48",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py313"

[project.scripts]
tt-backtest = "trading.cli.backtest:main"
tt-fetcher = "trading.data.fetcher:main"
tt-digest = "trading.cli.digest:main"
tt-serve = "trading.cli.serve:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
